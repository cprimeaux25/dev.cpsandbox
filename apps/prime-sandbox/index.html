<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Professional Services | Expert Developer Sandbox</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar card">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <p class="eyebrow">Prime Professional Services, LLC</p>
            <h1>Developer Sandbox</h1>
          </div>
        </div>

        <nav id="workspace-nav" class="stack"></nav>

        <section class="status card muted">
          <h3>Environment Status</h3>
          <ul id="status-list"></ul>
        </section>
      </aside>

      <main class="main-panel">
        <header class="topbar card">
          <div>
            <p class="eyebrow">Unified Engineering Console</p>
            <h2>One console for local + cloud + AI + MCP</h2>
          </div>
          <div class="actions">
            <button class="btn btn-secondary">Connect Cloud</button>
            <button class="btn btn-primary">Launch Workspace</button>
          </div>
        </header>

        <section class="grid">
          <article class="card" id="capabilities"></article>
          <article class="card" id="model-routing"></article>
          <article class="card" id="mcp-services"></article>
          <article class="card" id="automation"></article>
          <article class="card" id="security"></article>
          <article class="card" id="onboarding"></article>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
